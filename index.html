<header><h1>🍽️ FSS Compliance Tracker</h1><small id="role">Loading…</small><button id="bgbtn" onclick="bgModal()">🎨 Background</button></header>
<nav id="nav"></nav><main id="m"></main>
<div id="modal"><div id="mb"></div></div>
<script>
const TABS=[["dash","📊 Dashboard"],["fss","🏢 FSS & Sites"],["perm","📄 Permits"],["aud","🗓️ Audit Schedule"],["pest","🐀 Pest Trends"],["pcs","🗓️ Pest Control Schedule"],["rep","📑 Audit Reports"],["docs","📁 Audit Documents"],["rec","🚨 Mock Recall"],["cal","⚖️ Calibration"]];
const COLORS=["#7c3aed","#ec4899","#f59e0b","#22c55e","#0ea5e9","#e11d48","#14b8a6","#8b5cf6"];
let S={fss:[],sites:[],permits:[],audits:[],pests:[],pestfiles:[],reports:[],recalls:[],cal:[],pcs:[],notes:[]},tab="dash",owner=false,db=null,assets=null,ref=null,pf="";
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const days=d=>Math.round((new Date(d)-today())/864e5);
const PERMITS=["NMIS","BPI","BPI CSW","BPI DSW","BFAR","FSIC","DENR","Business Permit","Sanitary Permit","Other"],SPECIAL=["FSIC","DENR"];
const pStat=p=>{if(p.st)return"NA";const n=days(p.expiry);return n<0?"Expired":(n<=90&&!SPECIAL.includes(p.type))?"Renewal":"Ok"};
const site=id=>{const s=S.sites.find(x=>x.id===id);if(!s)return"—";const f=S.fss.find(x=>x.id===s.fss);return (f?f.name:"?")+" › "+s.name};
const siteOpts=()=>S.sites.map(s=>[s.id,site(s.id)]);
async function save(){try{await ref.set(db?(({permits,...r})=>r)(S):S);if(!db)view()}catch(e){toast("Could not save: "+(e.message||e.code||e))}}
function modal(title,fields,cb){let h=`<h2>${title}</h2>`;fields.forEach(f=>{h+=`<label>${f.l}</label>`+(f.o?`<select id="f_${f.k}">${f.o.map(o=>{const[v,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${f.v!=null&&String(f.v)===String(v)?"selected":""}>${esc(t)}</option>`}).join("")}</select>`:`<input id="f_${f.k}" type="${f.t||"text"}" ${f.t==="file"?`accept="${f.ac||"application/pdf,image/*"}" ${f.m?"multiple":""}`:""} value="${esc(f.v||"")}">`)});
h+=`<p><button class="a" id="ok">Save</button> <button class="a s" onclick="$('modal').style.display='none'">Cancel</button></p>`;$("mb").innerHTML=h;$("modal").style.display="flex";
$("ok").onclick=async()=>{const v={};fields.forEach(f=>{const e=$("f_"+f.k);v[f.k]=f.t==="file"?e.files[0]:e.value;if(f.t==="file")v[f.k+"s"]=[...e.files]});$("ok").disabled=true;let r;try{r=await cb(v)}catch(e){toast(e.message||e.code||e)}if(r===false){$("ok").disabled=false;return}$("modal").style.display="none"}}
async function up(file){if(!file)return"";if(!assets)throw Error("Uploads unavailable");return(await assets.upload(file)).id}
const SK=["notes","permits","audits","pests","pestfiles","reports","recalls","cal"];
const del=(k,id)=>ask(k==="fss"?"Delete this FSS and all their sites?":k==="sites"?"Delete this site and its records?":"Delete this record?",()=>{if(k==="permits"){S.permits=S.permits.filter(x=>x.id!==id);view();if(pcol)pcol.doc(id).delete().catch(e=>toast("Could not delete: "+(e.message||e.code)));else save();return}let ids=[];if(k==="fss"){ids=S.sites.filter(x=>x.fss===id).map(x=>x.id);S.sites=S.sites.filter(x=>x.fss!==id)}if(k==="sites")ids=[id];if(pcol)S.permits.filter(r=>ids.includes(r.site)).forEach(r=>pcol.doc(r.id).delete());if(phcol&&k==="fss")PH.filter(x=>x.fss===id).forEach(x=>phcol.doc(x.id).delete());SK.forEach(t=>{S[t]=S[t].filter(r=>!ids.includes(r.site))});S[k]=S[k].filter(x=>x.id!==id);save()});
const dbtn=(k,id)=>owner?`<button class="d" onclick="del('${k}','${id}')">✕</button>`:"";
const addb=(t,fn)=>owner?`<button class="a" onclick="${fn}">＋ ${t}</button>`:"";
const link=(id,n)=>id?`<a href="/_blob/${id}" target="_blank">📎 ${esc(n||"file")}</a>`:"—";

function chart(){const rows=S.pests.filter(p=>!pf||p.site===pf);if(!rows.length)return`<p class="mu">No trend data yet.</p>`;
const ms=[...new Set(rows.map(r=>r.month))].sort(),ps=[...new Set(rows.map(r=>r.pest))];const val=(m,p)=>rows.filter(r=>r.month===m&&r.pest===p).reduce((a,r)=>a+r.count,0);
const mx=Math.max(1,...ms.flatMap(m=>ps.map(p=>val(m,p))));const W=Math.max(520,ms.length*70+60),H=260,L=40,B=30,T=14,gw=(W-L-10)/ms.length;const y=v=>H-B-(v/mx)*(H-B-T);
let s=`<svg viewBox="0 0 ${W} ${H}" style="min-width:${W}px;width:100%">`;for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#8884" /><text x="4" y="${y(v)+4}">${v}</text>`}
const bw=Math.min(18,(gw-10)/ps.length);ms.forEach((m,i)=>{const x0=L+i*gw+gw/2-bw*ps.length/2;ps.forEach((p,j)=>{const v=val(m,p);s+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-2}" height="${H-B-y(v)}" rx="3" fill="${COLORS[j%8]}" opacity=".85"><title>${p} ${m}: ${v}</title></rect>`});s+=`<text x="${L+i*gw+gw/2}" y="${H-10}" text-anchor="middle">${m}</text>`});
ps.forEach((p,j)=>{const pts=ms.map((m,i)=>`${L+i*gw+gw/2},${y(val(m,p))}`).join(" ");s+=`<polyline points="${pts}" fill="none" stroke="${COLORS[j%8]}" stroke-width="2.5"/>`});
s+="</svg><div>"+ps.map((p,j)=>`<span style="margin-right:12px"><b style="color:${COLORS[j%8]}">●</b> ${p}</span>`).join("")+"</div>";return`<div class="tw">${s}</div>`}
